###
# Konfigurasi pengembangan — Praktikum PAW Pertemuan 6
# Database default: PostgreSQL lokal (sesuai spesifikasi tugas).
# Untuk pengujian tanpa PostgreSQL, pakai test.ini (SQLite).
###

[app:main]
use = egg:pyramid_mahasiswa

sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/paw_pertemuan6

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en

[server:main]
use = egg:waitress#main
listen = 127.0.0.1:6543

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
