###
# Konfigurasi PENGUJIAN saja (SQLite, tanpa PostgreSQL).
# Dipakai untuk verifikasi lokal di mesin tanpa server PostgreSQL.
# Untuk pengumpulan/penilaian, jalankan dengan development.ini.
###

[app:main]
use = egg:pyramid_mahasiswa

sqlalchemy.url = sqlite:///test.db

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en

[server:main]
use = egg:waitress#main
listen = 127.0.0.1:6543

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
