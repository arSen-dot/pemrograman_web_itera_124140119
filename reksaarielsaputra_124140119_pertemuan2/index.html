<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Dashboard — PAW Pertemuan 2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><line x1="22" y1="10" x2="22" y2="16"/></svg></div>
      <div class="brand-text">Personal<br><span>Dashboard</span></div>
    </div>
    <nav class="nav">
      <p class="nav-label">MENU</p>
      <button class="navbtn active" data-view="dashboard"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</button>
      <button class="navbtn" data-view="jadwal"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span> Jadwal Kuliah</button>
      <button class="navbtn" data-view="tugas"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span> Daftar Tugas</button>
      <button class="navbtn" data-view="catatan"><span class="nav-ico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span> Catatan</button>
    </nav>
    <div class="side-foot">
      <p>PAW · Pertemuan 2</p>
      <p class="dim">JavaScript Next Gen (ES6+)</p>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <input id="search" class="search" type="search" placeholder="Search (daftar saat ini)…">
      <div class="top-right">
        <button id="bell" class="iconbtn" title="Tugas aktif"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="bellBadge" class="badge-count hidden">0</span></button>
        <span id="clock" class="clock">--:--:--</span>
        <span id="weatherChip" class="weather-chip">…</span>
        <div class="user"><span class="avatar">R</span><span class="username">Reksa</span></div>
      </div>
    </header>

    <main class="content">
      <!-- ===== View: Dashboard (overview widget ala PMS) ===== -->
      <section id="view-dashboard" class="view">
        <h2 class="page-title">Dashboard</h2>
        <div id="dashWidgets" class="widgets"></div>
      </section>

      <!-- ===== View: Jadwal ===== -->
      <section id="view-jadwal" class="view hidden">
        <div class="view-head">
          <h2 class="page-title">Jadwal Kuliah</h2>
          <button class="btn-primary" data-add="jadwal">＋ Add</button>
        </div>
        <div id="jadwalList" class="stack"></div>
      </section>

      <!-- ===== View: Tugas ===== -->
      <section id="view-tugas" class="view hidden">
        <div class="view-head">
          <h2 class="page-title">Daftar Tugas</h2>
          <div class="flex items-center gap-2">
            <select id="filterTugas" class="input w-auto">
              <option value="semua">Semua</option>
              <option value="aktif">Belum selesai</option>
              <option value="selesai">Selesai</option>
            </select>
            <button class="btn-primary" data-add="tugas">＋ Add</button>
          </div>
        </div>
        <div id="tugasList" class="stack"></div>
      </section>

      <!-- ===== View: Catatan ===== -->
      <section id="view-catatan" class="view hidden">
        <div class="view-head">
          <h2 class="page-title">Catatan</h2>
          <button class="btn-primary" data-add="catatan">＋ Add</button>
        </div>
        <div id="catatanList" class="cards2"></div>
      </section>
    </main>
  </div>
</div>

<!-- ===== Modal form ===== -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle" class="text-lg font-bold mb-4"></h3>
    <form id="modalForm" class="space-y-3"></form>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
